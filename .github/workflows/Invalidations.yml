name: Invalidations

# Adding a method that invalidates existing compiled code costs every downstream
# user latency they did not ask for. This reports the count on a pull request
# against the same measurement on the default branch, so a regression is visible
# before it is merged rather than after someone notices their session got slower.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    if: github.base_ref != ''
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: actions/checkout@v5
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-invalidations@v1
        id: invs_pr

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-invalidations@v1
        id: invs_default

      # This step used to `echo` the two numbers and stop. A workflow that
      # prints a comparison and leaves the comparing to whoever reads the log is
      # the same as no workflow: nobody reads a green job. It now fails.
      - name: Compare
        run: |
          pr=${{ steps.invs_pr.outputs.total }}
          base=${{ steps.invs_default.outputs.total }}
          echo "PR:      $pr (deps: ${{ steps.invs_pr.outputs.deps }})"
          echo "default: $base (deps: ${{ steps.invs_default.outputs.deps }})"
          if [ "$pr" -gt "$base" ]; then
            echo "::error::this branch invalidates $pr method instances against           $base on the default branch. Every one of them is latency a downstream           user pays without asking. Run \`just invalidations\` locally: it says           whether the cause is a method this package inserts, which is ours to           narrow, or two dependencies meeting, which is not."
            exit 1
          fi
          echo "no regression ($pr <= $base)"
