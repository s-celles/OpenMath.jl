name: Invalidations

# Adding a method that invalidates existing compiled code costs every downstream
# user latency they did not ask for. This reports the count on a pull request
# against the same measurement on the default branch, so a regression is visible
# before it is merged rather than after someone notices their session got slower.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    if: github.base_ref != ''
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: actions/checkout@v5
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-invalidations@v1
        id: invs_pr

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-invalidations@v1
        id: invs_default

      - name: Report
        run: |
          echo "PR:      ${{ steps.invs_pr.outputs.total }} (deps: ${{ steps.invs_pr.outputs.deps }})"
          echo "default: ${{ steps.invs_default.outputs.total }} (deps: ${{ steps.invs_default.outputs.deps }})"
