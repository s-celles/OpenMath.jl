name: Fuzz

# Nightly, not on pull requests: a fuzz run is expensive and its value is in
# accumulating hours, not in gating a change. Unlike the differential oracle this
# is entirely self-contained — no network, no foreign toolchain — which is why it
# belongs in CI at all. The dividing line is external dependency, not cost.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Fuzzing budget in minutes"
        default: "30"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1

      - name: Fuzz
        id: fuzz
        run: |
          julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
          julia --project=test test/harness/fuzz.jl --minutes "${{ github.event.inputs.minutes || 30 }}"

      - name: Upload any new counterexamples
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: test/corpus/regression/
