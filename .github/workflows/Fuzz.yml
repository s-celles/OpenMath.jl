name: Fuzz

# Nightly, not on pull requests: a fuzz run is expensive and its value is in
# accumulating hours, not in gating a change. Unlike the differential oracle this
# is entirely self-contained — no network, no foreign toolchain — which is why it
# belongs in CI at all. The dividing line is external dependency, not cost.

# Phase 8's exit criterion is 24 hours clean before the freeze. A GitHub job is
# capped at six, so that is accumulated rather than run in one piece: nightly at
# 30 minutes, plus a weekly long run of 5 h 30. Seven nights and one long run is
# about nine hours a week, so the criterion is met after roughly three weeks of
# green — which is why it is scheduled now rather than at the freeze.
on:
  schedule:
    - cron: "0 3 * * *"        # nightly, 30 minutes
    - cron: "0 1 * * 6"        # Saturday, the long run
  workflow_dispatch:
    inputs:
      minutes:
        description: "Fuzzing budget in minutes"
        default: "30"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1

      - name: Fuzz
        id: fuzz
        run: |
          julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
          julia --project=test test/harness/fuzz.jl \
            --minutes "${{ github.event.inputs.minutes || (github.event.schedule == '0 1 * * 6' && 330 || 30) }}"

      - name: Upload any new counterexamples
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: test/corpus/regression/
