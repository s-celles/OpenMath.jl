# Performance baseline, written by `just bench --save`.
# Phase 8's exit criterion compares against these numbers.
#
# Throughput varies by roughly a factor of two between runs on a
# shared machine, so a regression budget against these has to be
# generous: they catch a change of order, not of constant factor.
# The time-to-first-parse figures are the stable ones.
